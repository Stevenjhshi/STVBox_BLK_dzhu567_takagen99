permissions:
  contents: write

name: Test Build

on:
#  push:
#    branches:
#      - main
#  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Get current time
        run: echo "formatted_time=$(TZ='Asia/Shanghai' date +'%Y%m%d_%H%M')" >> $GITHUB_ENV
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build With Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleArmeabiGenericRelease --build-cache --parallel --daemon --warning-mode all
      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          for file in `find ~ -name "*.apk" -print`; do
            mv "$file" "${{ github.workspace }}/apk/STVBox_${{ env.formatted_time }}_armeabi-v7a-java32.apk"
          done
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.osc
          path: ${{ github.workspace }}/apk/*
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: STVBox_${{ env.formatted_time }}
          name: STVBox_${{ env.formatted_time }}
          files: ${{ github.workspace }}/apk/*.apk
